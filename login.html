<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Antrian Rumah Sakit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-wrapper">
    <div class="login-card">
      <h1 class="login-title">Masuk</h1>
      <p class="login-subtitle">
        Halaman ini untuk mengakses Dashboard Admin dan Panel Operator. Layar Kiosk tidak memerlukan login.
      </p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Masukkan username" 
            autocomplete="username" 
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Masukkan password" 
            autocomplete="current-password" 
            required
          >
        </div>

        <button type="submit" id="loginBtn" class="btn-login" disabled>
          Masuk
        </button>

        <div id="error" class="error-box hidden" role="alert"></div>
      </form>

      <div class="login-footer">
        <p>
          Gunakan akun uji dari <a href="https://dummyjson.com/users" target="_blank" rel="noopener noreferrer">dummyjson.com/users</a> (contoh username/password tercantum di sana).
        </p>
      </div>
    </div>
  </main>

  <script src="dist/login.js" defer></script>
</body>
</html>
